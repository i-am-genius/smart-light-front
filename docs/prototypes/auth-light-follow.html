<!doctype html>
<html lang="zh-CN" data-follow-mode="desktop-pointer">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#010204">
  <title>Genius Light · 登录原型</title>
  <style>
    :root {
      --background: #010204;
      --foreground: #f4f5f8;
      --lamp-color: #ffb36b;
      --lamp-rgb: 255, 179, 107;
      --light-x: 74%;
      --light-y: 48%;
      --lamp-screen-x: 68vw;
      --peripheral-dim: .16;
      --spot-rx: 360px;
      --spot-ry: 285px;
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI",
        "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--background);
      color: var(--foreground);
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      overflow: hidden;
      background: #010204;
    }

    button,
    input { font: inherit; }

    button { color: inherit; }

    .experience {
      position: relative;
      width: 100vw;
      height: 100svh;
      min-height: 620px;
      overflow: hidden;
      isolation: isolate;
      background:
        radial-gradient(circle at 50% 8%, rgba(45, 53, 70, .16), transparent 32%),
        #010204;
    }

    .experience::after {
      position: absolute;
      inset: 0;
      z-index: 8;
      pointer-events: none;
      content: "";
      background:
        radial-gradient(circle at 50% 48%, transparent 46%, rgba(0, 0, 0, .34) 100%),
        linear-gradient(180deg, rgba(0, 0, 0, .17), transparent 18%, transparent 82%, rgba(0, 0, 0, .31));
      mix-blend-mode: multiply;
    }

    .page-stage {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: grid;
      place-items: center;
      padding: 56px 52px 42px;
      pointer-events: none;
    }

    .page-surface {
      --surface-w: min(1280px, calc(100vw - 104px));
      position: relative;
      width: var(--surface-w);
      aspect-ratio: 16 / 9;
      max-height: calc(100svh - 98px);
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, .13);
      border-radius: 26px;
      color: #f6f7fb;
      background:
        linear-gradient(90deg, rgba(255, 255, 255, .029) 1px, transparent 1px),
        linear-gradient(rgba(255, 255, 255, .029) 1px, transparent 1px),
        linear-gradient(140deg, #080a10 0%, #05060a 56%, #080811 100%);
      background-size: 50px 50px, 50px 50px, auto;
      box-shadow:
        0 34px 100px rgba(0, 0, 0, .6),
        inset 0 0 0 1px rgba(255, 255, 255, .022);
      pointer-events: auto;
      transform: perspective(1800px) rotateX(-.35deg);
      transform-origin: center;
    }

    .page-surface::before {
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      content: "";
      opacity: .11;
      background-image: radial-gradient(rgba(255, 255, 255, .28) .65px, transparent .65px);
      background-size: 7px 7px;
      mask-image: linear-gradient(145deg, black, transparent 72%);
    }

    .surface-form-fill,
    .surface-light,
    .surface-bloom,
    .surface-darkness {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .surface-form-fill {
      z-index: 3;
      background: radial-gradient(
        ellipse 310px 270px at 79% 52%,
        rgba(255, 179, 107, .105),
        transparent 76%
      );
      mix-blend-mode: screen;
    }

    .surface-light {
      z-index: 4;
      opacity: .48;
      background: radial-gradient(
        ellipse var(--spot-rx) var(--spot-ry) at var(--light-x) var(--light-y),
        rgba(var(--lamp-rgb), .29) 0%,
        rgba(var(--lamp-rgb), .15) 34%,
        rgba(var(--lamp-rgb), .045) 70%,
        transparent 100%
      );
      mix-blend-mode: screen;
      filter: saturate(1.04);
    }

    .surface-bloom {
      z-index: 4;
      opacity: .17;
      background: radial-gradient(
        circle 112px at var(--light-x) var(--light-y),
        rgba(255, 255, 255, .2),
        transparent 100%
      );
      mix-blend-mode: screen;
      filter: blur(22px);
    }

    .surface-darkness {
      z-index: 5;
      background: rgba(0, 0, 0, var(--peripheral-dim));
      mask-image: radial-gradient(
        ellipse var(--spot-rx) var(--spot-ry) at var(--light-x) var(--light-y),
        transparent 0 42%,
        #000 100%
      );
    }

    .page-header {
      position: relative;
      z-index: 2;
      height: 10.1%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 3.75%;
      border-bottom: 1px solid rgba(255, 255, 255, .105);
    }

    .page-brand,
    .page-status {
      display: flex;
      align-items: center;
    }

    .page-brand {
      gap: 11px;
      font-size: clamp(12px, 1.05vw, 16px);
      font-weight: 780;
    }

    .page-logo {
      position: relative;
      width: clamp(28px, 2.35vw, 34px);
      height: clamp(28px, 2.35vw, 34px);
      display: grid;
      place-items: center;
      border-radius: 8px;
      background: #f4f5f8;
    }

    .page-logo::before {
      width: 13px;
      height: 10px;
      content: "";
      border: 2px solid #12141a;
      border-bottom: 0;
      border-radius: 9px 9px 2px 2px;
    }

    .page-logo::after {
      position: absolute;
      bottom: 7px;
      width: 18px;
      height: 8px;
      content: "";
      border-radius: 2px 2px 8px 8px;
      background: #12141a;
      clip-path: polygon(24% 0, 76% 0, 100% 100%, 0 100%);
    }

    .brand-suffix {
      margin-left: 2px;
      color: rgba(238, 240, 247, .48);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: clamp(6px, .62vw, 9px);
      font-weight: 600;
    }

    .page-status {
      gap: 8px;
      color: rgba(239, 241, 247, .6);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: clamp(6px, .61vw, 9px);
    }

    .page-status span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #7cd6af;
      box-shadow: 0 0 15px #7cd6af;
    }

    .page-main {
      position: relative;
      z-index: 2;
      height: 78.8%;
      display: grid;
      grid-template-columns: minmax(0, 1.45fr) minmax(310px, .55fr);
      align-items: center;
      gap: 4.6%;
      padding: 4% 3.75% 3.2%;
    }

    .page-copy { min-width: 0; }

    .page-kicker {
      margin: 0 0 2.1%;
      color: #ffc58d;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: clamp(7px, .73vw, 10px);
      font-weight: 650;
    }

    .page-copy h1 {
      max-width: 810px;
      margin: 0;
      color: #f7f7fa;
      font-size: clamp(42px, 5.08vw, 73px);
      font-weight: 670;
      line-height: .98;
    }

    .page-copy h1 span { color: rgba(247, 247, 250, .66); }

    .page-subtitle {
      width: 690px;
      max-width: 94%;
      margin: 2.3% 0 0;
      color: #e9b989;
      font-size: clamp(13px, 1.36vw, 19px);
      font-weight: 520;
      line-height: 1.42;
    }

    .capabilities {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 4.1%;
    }

    .capability {
      min-width: 98px;
      height: clamp(32px, 3vw, 39px);
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 0 13px;
      border: 1px solid rgba(255, 255, 255, .14);
      border-radius: 999px;
      color: rgba(246, 247, 251, .7);
      background: rgba(255, 255, 255, .025);
      font-size: clamp(8px, .77vw, 11px);
      font-weight: 620;
    }

    .capability span {
      color: rgba(246, 247, 251, .38);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 7px;
    }

    .page-description {
      max-width: 650px;
      min-height: 42px;
      margin: 1.55% 0 0;
      color: rgba(238, 240, 247, .64);
      font-size: clamp(9px, .88vw, 12px);
      line-height: 1.58;
    }

    .page-description b {
      margin-right: 9px;
      color: rgba(246, 247, 251, .88);
      font-weight: 620;
    }

    .login-card {
      align-self: center;
      width: 100%;
      padding: clamp(20px, 2vw, 28px);
      border: 1px solid rgba(255, 255, 255, .16);
      border-radius: 19px;
      background: rgba(13, 15, 21, .9);
      box-shadow: 0 24px 70px rgba(0, 0, 0, .3);
      backdrop-filter: blur(13px);
    }

    .login-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: clamp(18px, 2.1vw, 28px);
    }

    .login-heading p,
    .login-heading span { margin: 0; }

    .login-heading p {
      font-size: clamp(11px, .9vw, 13px);
      font-weight: 720;
    }

    .login-heading div > span {
      display: block;
      margin-top: 5px;
      color: rgba(237, 239, 246, .48);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 8px;
    }

    .secure-state {
      height: 29px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 0 9px;
      border: 1px solid rgba(var(--lamp-rgb), .32);
      border-radius: 999px;
      color: rgba(255, 255, 255, .82);
      background: rgba(var(--lamp-rgb), .07);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 8px;
    }

    .secure-state i {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--lamp-color);
      box-shadow: 0 0 11px var(--lamp-color);
    }

    .field {
      display: block;
      margin-top: clamp(13px, 1.5vw, 20px);
    }

    .field-label {
      display: flex;
      justify-content: space-between;
      margin-bottom: 9px;
      color: rgba(244, 245, 249, .68);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: clamp(8px, .7vw, 10px);
    }

    .field-label output { color: rgba(244, 245, 249, .4); }

    .input-shell { position: relative; }

    .input-shell input {
      width: 100%;
      height: clamp(40px, 3.5vw, 47px);
      padding: 0 52px 0 14px;
      border: 1px solid rgba(255, 255, 255, .14);
      border-radius: 10px;
      outline: none;
      color: rgba(248, 248, 251, .94);
      background: rgba(255, 255, 255, .038);
      font-size: clamp(10px, .86vw, 12px);
      user-select: auto;
      transition: border-color 150ms ease, background 150ms ease, box-shadow 150ms ease;
    }

    .input-shell input::placeholder { color: rgba(244, 245, 249, .42); }

    .input-shell input:focus {
      border-color: rgba(var(--lamp-rgb), .58);
      background: rgba(var(--lamp-rgb), .055);
      box-shadow: 0 0 0 3px rgba(var(--lamp-rgb), .11);
    }

    .password-toggle {
      position: absolute;
      top: 50%;
      right: 7px;
      min-width: 38px;
      height: 31px;
      transform: translateY(-50%);
      padding: 0 8px;
      border: 0;
      border-radius: 8px;
      color: rgba(244, 245, 249, .58);
      background: transparent;
      cursor: pointer;
      font-size: 10px;
    }

    .password-toggle:hover { background: rgba(255, 255, 255, .055); }

    .login-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: clamp(13px, 1.4vw, 18px) 0;
      color: rgba(244, 245, 249, .58);
      font-size: clamp(8px, .72vw, 10px);
    }

    .remember {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      cursor: pointer;
    }

    .remember input { accent-color: var(--lamp-color); }

    .login-meta a,
    .register a {
      color: #ffc58d;
      text-decoration: none;
    }

    .login-meta a:hover,
    .register a:hover { text-decoration: underline; }

    .login-submit {
      width: 100%;
      height: clamp(40px, 3.45vw, 47px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      border: 1px solid rgba(var(--lamp-rgb), .38);
      border-radius: 10px;
      color: rgba(252, 249, 244, .94);
      background: rgba(var(--lamp-rgb), .15);
      cursor: pointer;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: clamp(9px, .72vw, 10px);
      font-weight: 650;
      transition: color 150ms ease, border-color 150ms ease, background 150ms ease;
    }

    .login-submit:hover {
      color: #fff;
      border-color: rgba(var(--lamp-rgb), .66);
      background: rgba(var(--lamp-rgb), .22);
    }

    .login-submit:focus-visible,
    .password-toggle:focus-visible,
    a:focus-visible {
      outline: 2px solid #ffd1a4;
      outline-offset: 3px;
    }

    .login-submit:disabled { cursor: wait; opacity: .72; }

    .message {
      min-height: 14px;
      margin: 9px 0 -4px;
      color: #ffad98;
      font-size: clamp(8px, .7vw, 10px);
      text-align: center;
    }

    .register {
      margin: 13px 0 0;
      color: rgba(239, 241, 247, .48);
      font-size: clamp(8px, .7vw, 10px);
      text-align: center;
    }

    .page-footer {
      position: absolute;
      inset: auto 0 0;
      z-index: 2;
      height: 11.1%;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 24px;
      padding: 0 3.75%;
      border-top: 1px solid rgba(255, 255, 255, .1);
      color: rgba(239, 241, 247, .44);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: clamp(6px, .58vw, 8px);
    }

    .page-footer p { margin: 0; }
    .page-footer > p:last-child { text-align: right; }

    .system-state {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: rgba(239, 241, 247, .62);
    }

    .system-state i {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--lamp-color);
      box-shadow: 0 0 10px rgba(var(--lamp-rgb), .72);
    }

    .webgl-canvas {
      position: absolute;
      inset: 0;
      z-index: 7;
      display: block;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .fallback-lamp {
      position: absolute;
      top: 0;
      left: var(--lamp-screen-x);
      z-index: 7;
      width: 2px;
      height: 180px;
      transform: translateX(-50%);
      background: #25272d;
      pointer-events: none;
    }

    .fallback-lamp::before {
      position: absolute;
      bottom: -37px;
      left: 50%;
      width: 164px;
      height: 56px;
      content: "";
      transform: translateX(-50%);
      border-radius: 55% 55% 12% 12% / 80% 80% 20% 20%;
      background: linear-gradient(90deg, #0b0d11, #2b2e36 42%, #111319 72%, #08090d);
      clip-path: polygon(40% 0, 60% 0, 100% 90%, 96% 100%, 4% 100%, 0 90%);
      box-shadow: inset 0 2px rgba(255, 255, 255, .08), 0 18px 28px rgba(0, 0, 0, .46);
    }

    .fallback-lamp::after {
      position: absolute;
      bottom: -43px;
      left: 50%;
      width: 142px;
      height: 15px;
      content: "";
      transform: translateX(-50%);
      border-radius: 50%;
      background: radial-gradient(ellipse, #fff7df, var(--lamp-color) 42%, #151316 76%);
      box-shadow: 0 0 24px rgba(var(--lamp-rgb), .62);
    }

    .experience.three-ready .fallback-lamp { display: none; }

    @media (max-width: 760px) {
      :root {
        --light-x: 50%;
        --light-y: 65%;
        --lamp-screen-x: 50vw;
        --spot-rx: 300px;
        --spot-ry: 330px;
      }

      .experience { min-height: 620px; }
      .page-stage { padding: 54px 14px 36px; }

      .page-surface {
        --surface-w: min(480px, calc(100vw - 28px));
        width: var(--surface-w);
        height: min(760px, calc(100svh - 90px));
        aspect-ratio: auto;
        border-radius: 23px;
        background-size: 44px 44px, 44px 44px, auto;
      }

      .page-header { height: 72px; padding: 0 23px; }
      .brand-suffix { display: none; }
      .page-status { font-size: 7px; }

      .page-main {
        height: calc(100% - 146px);
        display: flex;
        flex-direction: column;
        align-items: stretch;
        justify-content: center;
        gap: 26px;
        padding: 36px 23px 28px;
      }

      .page-copy h1 { font-size: clamp(36px, 11.2vw, 50px); }
      .page-subtitle { max-width: 100%; margin-top: 14px; font-size: 13px; }
      .capabilities { margin-top: 22px; }
      .capability:nth-child(n+3),
      .page-description { display: none; }
      .login-card { padding: 21px; }
      .field { margin-top: 14px; }

      .page-footer {
        height: 74px;
        grid-template-columns: 1fr auto;
        padding: 0 23px;
      }

      .page-footer > p:first-child { display: none; }
      .page-footer > p:last-child { text-align: right; }

      .surface-form-fill {
        background: radial-gradient(
          ellipse 260px 320px at 50% 70%,
          rgba(255, 179, 107, .12),
          transparent 78%
        );
      }

      .fallback-lamp { height: 132px; }
      .fallback-lamp::before { width: 132px; height: 46px; bottom: -31px; }
      .fallback-lamp::after { width: 113px; bottom: -37px; }
    }

    @media (max-width: 760px) and (max-height: 730px) {
      .page-stage { padding-top: 40px; }
      .page-main { gap: 18px; padding-top: 22px; }
      .page-copy h1 { font-size: 34px; }
      .capabilities { display: none; }
      .login-heading { margin-bottom: 14px; }
      .page-footer { height: 64px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>
<body>
  <main class="experience" id="experience">
    <div class="page-stage">
      <section class="page-surface" id="pageSurface" aria-label="Genius Light 登录">
        <header class="page-header">
          <div class="page-brand">
            <span class="page-logo" aria-hidden="true"></span>
            <span>GENIUS LIGHT</span>
            <span class="brand-suffix">SMART RETAIL LIGHTING</span>
          </div>
          <div class="page-status"><span></span> 服务在线</div>
        </header>

        <div class="page-main">
          <section class="page-copy" aria-labelledby="pageTitle">
            <p class="page-kicker">门店照明控制中心</p>
            <h1 id="pageTitle">让每一束光<br><span>准确落在需要的位置。</span></h1>
            <p class="page-subtitle">连接灯具、环境与门店运营，在一个安静清晰的界面中完成日常控制。</p>

            <div class="capabilities" aria-label="系统能力">
              <div class="capability"><span>01</span>设备联动</div>
              <div class="capability"><span>02</span>照明策略</div>
              <div class="capability"><span>03</span>环境感知</div>
              <div class="capability"><span>04</span>能耗分析</div>
            </div>
            <p class="page-description"><b>实时状态</b>门店设备与照明数据已准备就绪，登录后进入控制台。</p>
          </section>

          <form class="login-card" id="loginForm" novalidate>
            <div class="login-heading">
              <div>
                <p>登录账号</p>
                <span>进入门店灯光与设备看板</span>
              </div>
              <span class="secure-state"><i></i>安全连接</span>
            </div>

            <label class="field" for="username">
              <span class="field-label"><span>账号</span><output>ACCOUNT</output></span>
              <span class="input-shell">
                <input id="username" name="username" type="text" autocomplete="username" placeholder="请输入用户名">
              </span>
            </label>

            <label class="field" for="password">
              <span class="field-label"><span>密码</span><output>PASSWORD</output></span>
              <span class="input-shell">
                <input id="password" name="password" type="password" autocomplete="current-password" placeholder="请输入密码">
                <button class="password-toggle" id="passwordToggle" type="button" aria-label="显示密码">显示</button>
              </span>
            </label>

            <div class="login-meta">
              <label class="remember"><input type="checkbox" id="rememberMe">记住我</label>
              <a href="#">忘记密码？</a>
            </div>

            <button class="login-submit" id="submitButton" type="submit">
              <span>进入控制中心</span><span aria-hidden="true">→</span>
            </button>
            <p class="message" id="formMessage" aria-live="polite"></p>
            <p class="register">还没有账号？ <a href="#">立即注册</a></p>
          </form>
        </div>

        <footer class="page-footer">
          <p>LIGHT / DEVICE / STORE / ENERGY</p>
          <span class="system-state"><i></i>自动照明已启用</span>
          <p>GENIUS SMART RETAIL SYSTEM</p>
        </footer>

        <div class="surface-form-fill" aria-hidden="true"></div>
        <div class="surface-light" aria-hidden="true"></div>
        <div class="surface-bloom" aria-hidden="true"></div>
        <div class="surface-darkness" aria-hidden="true"></div>
      </section>
    </div>

    <canvas class="webgl-canvas" id="lightCanvas" aria-hidden="true"></canvas>
    <div class="fallback-lamp" aria-hidden="true"></div>
  </main>

  <script type="module">
    const experience = document.getElementById('experience')
    const pageSurface = document.getElementById('pageSurface')
    const canvas = document.getElementById('lightCanvas')
    const desktopFollow = matchMedia('(min-width: 761px)')
    const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)')

    const pointerTarget = { x: innerWidth * .68, y: innerHeight * .5 }
    const lampState = { position: innerWidth * .68, velocity: 0 }
    const lightState = { x: pointerTarget.x, y: pointerTarget.y }
    let headAngle = 0
    let animationFrame = 0
    let lastTime = performance.now()
    let renderThree = () => {}
    let resizeThree = () => {}
    let setThreePose = () => {}

    /* MOTION_KERNEL_START */
    function advanceFollower(state, target, dt) {
      const error = target - state.position
      const direction = Math.sign(error)
      const acceleration = direction * Math.min(2600, 90 * Math.pow(Math.abs(error), .72))
      const damping = Math.exp(-8.6 * dt)
      let velocity = (state.velocity + acceleration * dt) * damping
      const maxSpeed = 540
      velocity = Math.max(-maxSpeed, Math.min(maxSpeed, velocity))
      let position = state.position + velocity * dt
      if ((direction > 0 && position >= target) || (direction < 0 && position <= target)) {
        position = target
        velocity = 0
      }
      return { position, velocity }
    }
    /* MOTION_KERNEL_END */

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value))
    }

    function isStaticMode() {
      return !desktopFollow.matches || reduceMotion.matches
    }

    function defaultTarget() {
      if (isStaticMode()) {
        return { lampX: innerWidth * .5, lightX: innerWidth * .5, lightY: innerHeight * .66 }
      }
      return { lampX: innerWidth * .68, lightX: innerWidth * .74, lightY: innerHeight * .5 }
    }

    function applyLighting(screenX, screenY) {
      const rect = pageSurface.getBoundingClientRect()
      const localX = clamp(screenX - rect.left, rect.width * .08, rect.width * .92)
      const localY = clamp(screenY - rect.top, rect.height * .16, rect.height * .88)
      pageSurface.style.setProperty('--light-x', `${localX}px`)
      pageSurface.style.setProperty('--light-y', `${localY}px`)
    }

    function applyStaticState() {
      const target = defaultTarget()
      pointerTarget.x = target.lightX
      pointerTarget.y = target.lightY
      lampState.position = target.lampX
      lampState.velocity = 0
      lightState.x = target.lightX
      lightState.y = target.lightY
      headAngle = 0
      experience.style.setProperty('--lamp-screen-x', `${target.lampX}px`)
      applyLighting(target.lightX, target.lightY)
      setThreePose(target.lampX, 0)
      renderThree()
    }

    function animate(time) {
      animationFrame = 0
      if (isStaticMode()) {
        applyStaticState()
        return
      }

      const dt = Math.min(.035, Math.max(.001, (time - lastTime) / 1000))
      lastTime = time
      const trackTarget = clamp(pointerTarget.x, innerWidth * .22, innerWidth * .78)
      const next = advanceFollower(lampState, trackTarget, dt)
      lampState.position = next.position
      lampState.velocity = next.velocity

      const lightEase = 1 - Math.exp(-4.2 * dt)
      lightState.x += (pointerTarget.x - lightState.x) * lightEase
      lightState.y += (pointerTarget.y - lightState.y) * lightEase

      const lampY = Math.min(220, innerHeight * .24)
      const desiredAngle = clamp(Math.atan2(lightState.x - lampState.position, Math.max(180, lightState.y - lampY)) * .58, -.32, .32)
      headAngle += (desiredAngle - headAngle) * (1 - Math.exp(-5.4 * dt))

      experience.style.setProperty('--lamp-screen-x', `${lampState.position}px`)
      applyLighting(lightState.x, lightState.y)
      setThreePose(lampState.position, headAngle)
      renderThree()

      const lampError = Math.abs(trackTarget - lampState.position)
      const lightError = Math.hypot(pointerTarget.x - lightState.x, pointerTarget.y - lightState.y)
      if (lampError > .15 || Math.abs(lampState.velocity) > .15 || lightError > .2 || Math.abs(desiredAngle - headAngle) > .0005) {
        animationFrame = requestAnimationFrame(animate)
      }
    }

    function startAnimation() {
      if (isStaticMode() || animationFrame) return
      lastTime = performance.now()
      animationFrame = requestAnimationFrame(animate)
    }

    window.addEventListener('pointermove', (event) => {
      if (isStaticMode()) return
      pointerTarget.x = event.clientX
      pointerTarget.y = event.clientY
      startAnimation()
    }, { passive: true })

    document.documentElement.addEventListener('mouseleave', () => {
      const target = defaultTarget()
      pointerTarget.x = target.lightX
      pointerTarget.y = target.lightY
      startAnimation()
    })

    function handleModeChange() {
      if (animationFrame) {
        cancelAnimationFrame(animationFrame)
        animationFrame = 0
      }
      applyStaticState()
      resizeThree()
    }

    desktopFollow.addEventListener('change', handleModeChange)
    reduceMotion.addEventListener('change', handleModeChange)
    window.addEventListener('resize', () => {
      resizeThree()
      applyStaticState()
    }, { passive: true })

    const password = document.getElementById('password')
    const passwordToggle = document.getElementById('passwordToggle')
    passwordToggle.addEventListener('click', () => {
      const showing = password.type === 'text'
      password.type = showing ? 'password' : 'text'
      passwordToggle.textContent = showing ? '显示' : '隐藏'
      passwordToggle.setAttribute('aria-label', showing ? '显示密码' : '隐藏密码')
      password.focus({ preventScroll: true })
    })

    const loginForm = document.getElementById('loginForm')
    const username = document.getElementById('username')
    const message = document.getElementById('formMessage')
    const submitButton = document.getElementById('submitButton')

    for (const input of [username, password]) {
      input.addEventListener('input', () => {
        message.textContent = ''
        message.style.color = ''
      })
    }

    loginForm.addEventListener('submit', (event) => {
      event.preventDefault()
      if (!username.value.trim()) {
        message.textContent = '请输入账号'
        username.focus()
        return
      }
      if (!password.value) {
        message.textContent = '请输入密码'
        password.focus()
        return
      }
      submitButton.disabled = true
      submitButton.firstElementChild.textContent = '正在验证'
      message.style.color = '#87d6b3'
      message.textContent = '原型登录正常，等待接入真实接口'
      window.setTimeout(() => {
        submitButton.disabled = false
        submitButton.firstElementChild.textContent = '进入控制中心'
      }, 850)
    })

    applyStaticState()

    try {
      const THREE = await import('https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.module.js')
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, powerPreference: 'high-performance' })
      renderer.outputColorSpace = THREE.SRGBColorSpace
      renderer.toneMapping = THREE.NeutralToneMapping
      renderer.toneMappingExposure = 1.08
      renderer.setClearColor(0x000000, 0)

      const scene = new THREE.Scene()
      const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, .1, 1200)
      camera.position.set(0, 0, 600)
      camera.lookAt(0, 0, 0)

      const ambient = new THREE.HemisphereLight(0x8392ac, 0x151118, 1.15)
      scene.add(ambient)
      const fill = new THREE.DirectionalLight(0x93a8c9, 1.5)
      fill.position.set(-260, 320, 500)
      scene.add(fill)

      const rail = new THREE.Mesh(
        new THREE.BoxGeometry(230, 7, 12),
        new THREE.MeshStandardMaterial({ color: 0x111319, roughness: .55, metalness: .78 }),
      )
      scene.add(rail)

      const ceilingCap = new THREE.Mesh(
        new THREE.CylinderGeometry(19, 24, 10, 28),
        new THREE.MeshStandardMaterial({ color: 0x111319, roughness: .62, metalness: .72 }),
      )
      ceilingCap.rotation.x = Math.PI / 2
      scene.add(ceilingCap)

      const cable = new THREE.Mesh(
        new THREE.CylinderGeometry(1.25, 1.25, 1, 10),
        new THREE.MeshStandardMaterial({ color: 0x15161b, roughness: .5, metalness: .58 }),
      )
      scene.add(cable)

      const lampRoot = new THREE.Group()
      scene.add(lampRoot)
      const shadeGroup = new THREE.Group()
      lampRoot.add(shadeGroup)

      const shadeProfile = [
        new THREE.Vector2(6, 7),
        new THREE.Vector2(13, 3),
        new THREE.Vector2(30, -7),
        new THREE.Vector2(59, -20),
        new THREE.Vector2(82, -29),
        new THREE.Vector2(84, -33),
      ]
      const shade = new THREE.Mesh(
        new THREE.LatheGeometry(shadeProfile, 64),
        new THREE.MeshStandardMaterial({ color: 0x0f1015, roughness: .34, metalness: .76, side: THREE.DoubleSide }),
      )
      shadeGroup.add(shade)

      const rim = new THREE.Mesh(
        new THREE.TorusGeometry(84, 2.2, 9, 64),
        new THREE.MeshStandardMaterial({ color: 0x1b1c22, roughness: .27, metalness: .84 }),
      )
      rim.rotation.x = Math.PI / 2
      rim.position.y = -32
      shadeGroup.add(rim)

      const undersideMaterial = new THREE.MeshStandardMaterial({
        color: 0x332217,
        emissive: 0xffb36b,
        emissiveIntensity: .52,
        roughness: .92,
        side: THREE.DoubleSide,
      })
      const underside = new THREE.Mesh(new THREE.CircleGeometry(81, 64), undersideMaterial)
      underside.rotation.x = Math.PI / 2
      underside.position.y = -31
      shadeGroup.add(underside)

      const connector = new THREE.Mesh(
        new THREE.CylinderGeometry(7, 10, 18, 24),
        new THREE.MeshStandardMaterial({ color: 0x9c6744, roughness: .43, metalness: .68 }),
      )
      connector.position.y = 7
      shadeGroup.add(connector)

      const bulbMaterial = new THREE.MeshStandardMaterial({
        color: 0xffd7ad,
        emissive: 0xffb36b,
        emissiveIntensity: 3.3,
        roughness: .2,
      })
      const bulb = new THREE.Mesh(new THREE.SphereGeometry(12, 24, 16), bulbMaterial)
      bulb.scale.y = 1.2
      bulb.position.y = -29
      shadeGroup.add(bulb)

      const glowCanvas = document.createElement('canvas')
      glowCanvas.width = glowCanvas.height = 96
      const context = glowCanvas.getContext('2d')
      const gradient = context.createRadialGradient(48, 48, 0, 48, 48, 48)
      gradient.addColorStop(0, 'rgba(255,255,255,1)')
      gradient.addColorStop(.16, 'rgba(255,222,172,.82)')
      gradient.addColorStop(.46, 'rgba(255,170,94,.22)')
      gradient.addColorStop(1, 'rgba(255,140,70,0)')
      context.fillStyle = gradient
      context.fillRect(0, 0, 96, 96)
      const glowMaterial = new THREE.SpriteMaterial({
        map: new THREE.CanvasTexture(glowCanvas),
        color: 0xffb36b,
        transparent: true,
        opacity: .82,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
      })
      const glow = new THREE.Sprite(glowMaterial)
      glow.position.y = -30
      glow.scale.set(82, 82, 82)
      shadeGroup.add(glow)

      const bulbLight = new THREE.PointLight(0xffb36b, 1, 270, 2)
      bulbLight.power = 42
      bulbLight.position.set(0, -28, 18)
      shadeGroup.add(bulbLight)

      let lampY = 0
      let cableLength = 170

      resizeThree = () => {
        const width = Math.max(1, innerWidth)
        const height = Math.max(1, innerHeight)
        const dpr = Math.min(devicePixelRatio || 1, width < 760 ? 1.25 : 1.6)
        renderer.setPixelRatio(dpr)
        renderer.setSize(width, height, false)
        camera.left = -width / 2
        camera.right = width / 2
        camera.top = height / 2
        camera.bottom = -height / 2
        camera.updateProjectionMatrix()

        const mobile = width <= 760
        cableLength = mobile ? Math.min(132, height * .17) : Math.min(190, Math.max(156, height * .21))
        lampY = height / 2 - cableLength
        rail.position.set(0, height / 2 - 8, 35)
        rail.scale.x = Math.max(.8, width / 1100)
        setThreePose(lampState.position, headAngle)
        renderThree()
      }

      setThreePose = (screenX, angle) => {
        const worldX = screenX - innerWidth / 2
        const anchorY = innerHeight / 2 + 2
        ceilingCap.position.set(worldX, anchorY, 35)
        cable.position.set(worldX, anchorY - cableLength / 2, 35)
        cable.scale.set(1, cableLength, 1)
        lampRoot.position.set(worldX, lampY, 0)
        lampRoot.rotation.z = angle
      }

      renderThree = () => renderer.render(scene, camera)
      resizeThree()
      applyStaticState()
      experience.classList.add('three-ready')
    } catch (error) {
      console.error('Three.js light scene failed to initialize.', error)
      applyStaticState()
    }
  </script>
</body>
</html>
