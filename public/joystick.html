<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>云台摇杆控制</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 20px;
      color: #e2e8f0;
    }

    .container {
      width: 100%;
      max-width: 480px;
      background: rgba(30, 41, 59, 0.95);
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }

    h1 {
      text-align: center;
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 24px;
      background: linear-gradient(90deg, #60a5fa, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .section {
      background: rgba(15, 23, 42, 0.6);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
      border: 1px solid rgba(148, 163, 184, 0.1);
    }

    .section-title {
      font-size: 14px;
      font-weight: 600;
      color: #94a3b8;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    input, select {
      width: 100%;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid rgba(148, 163, 184, 0.2);
      background: rgba(15, 23, 42, 0.8);
      color: #e2e8f0;
      font-size: 14px;
      outline: none;
    }

    input:focus { border-color: #3b82f6; }
    input::placeholder { color: #64748b; }

    .btn-row {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    button {
      flex: 1;
      padding: 10px 16px;
      border-radius: 10px;
      border: none;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: white;
    }

    .btn-primary:hover { transform: translateY(-1px); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .btn-secondary {
      background: rgba(100, 116, 139, 0.3);
      color: #94a3b8;
    }

    .btn-secondary:hover { background: rgba(100, 116, 139, 0.5); }

    /* 设备列表 */
    .device-list {
      max-height: 200px;
      overflow-y: auto;
      margin-top: 12px;
    }

    .device-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      border-radius: 10px;
      background: rgba(15, 23, 42, 0.4);
      margin-bottom: 8px;
      cursor: pointer;
      transition: all 0.2s;
      border: 2px solid transparent;
    }

    .device-item:hover {
      background: rgba(59, 130, 246, 0.1);
      border-color: rgba(59, 130, 246, 0.3);
    }

    .device-item.selected {
      background: rgba(59, 130, 246, 0.2);
      border-color: #3b82f6;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .status-dot.online {
      background: #22c55e;
      box-shadow: 0 0 8px rgba(34, 197, 94, 0.5);
    }

    .status-dot.offline { background: #64748b; }

    .device-info { flex: 1; min-width: 0; }

    .device-name {
      font-size: 14px;
      font-weight: 600;
      color: #e2e8f0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .device-meta {
      font-size: 12px;
      color: #64748b;
      margin-top: 2px;
    }

    .device-type {
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      background: rgba(100, 116, 139, 0.3);
      color: #94a3b8;
    }

    .empty-state {
      text-align: center;
      padding: 20px;
      color: #64748b;
      font-size: 14px;
    }

    /* 控制区 */
    .control-section { display: none; }
    .control-section.active { display: block; }

    .selected-device-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(59, 130, 246, 0.15);
      border: 1px solid rgba(59, 130, 246, 0.3);
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 16px;
    }

    .selected-device-bar .name {
      font-weight: 600;
      color: #60a5fa;
    }

    .selected-device-bar .ip {
      font-size: 12px;
      color: #94a3b8;
    }

    .selected-device-bar button {
      padding: 6px 12px;
      font-size: 12px;
    }

    /* 速度选择 */
    .speed-section {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      justify-content: center;
    }

    .speed-btn {
      padding: 8px 20px;
      border-radius: 20px;
      border: 2px solid rgba(148, 163, 184, 0.2);
      background: rgba(15, 23, 42, 0.6);
      color: #94a3b8;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .speed-btn.active {
      border-color: #3b82f6;
      background: rgba(59, 130, 246, 0.2);
      color: #60a5fa;
    }

    /* 模式切换 */
    .mode-toggle {
      display: flex;
      justify-content: center;
      margin-bottom: 16px;
    }

    .mode-btn {
      padding: 10px 24px;
      border-radius: 12px;
      border: 2px solid rgba(167, 139, 250, 0.3);
      background: rgba(167, 139, 250, 0.1);
      color: #a78bfa;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .mode-btn.active {
      background: rgba(34, 197, 94, 0.15);
      border-color: rgba(34, 197, 94, 0.5);
      color: #4ade80;
    }

    /* 摇杆区域 */
    .joystick-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .joystick-wrapper {
      position: relative;
      width: 220px;
      height: 220px;
    }

    .joystick-base {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background: linear-gradient(145deg, #2a3a4a, #1a2a3a);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .joystick-track {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #1e293b, #0f172a);
      box-shadow: inset 0 4px 12px rgba(0, 0, 0, 0.8);
    }

    .joystick-knob {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: linear-gradient(145deg, #4a5a6a, #3a4a5a);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.6);
      cursor: grab;
      touch-action: none;
      user-select: none;
    }

    .joystick-knob:active { cursor: grabbing; }

    .joystick-knob::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: radial-gradient(circle at 40% 40%, #6a7a8a, #4a5a6a);
    }

    /* 方向箭头 */
    .arrow {
      position: absolute;
      width: 0;
      height: 0;
      border-left: 10px solid transparent;
      border-right: 10px solid transparent;
      opacity: 0.3;
      transition: opacity 0.2s, transform 0.2s;
    }

    .arrow.active {
      opacity: 1;
      transform: scale(1.3);
    }

    .arrow-up {
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      border-bottom: 14px solid #60a5fa;
    }
    .arrow-up.active { transform: translateX(-50%) scale(1.3); }

    .arrow-down {
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      border-top: 14px solid #60a5fa;
    }
    .arrow-down.active { transform: translateX(-50%) scale(1.3); }

    .arrow-left {
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      border-right: 14px solid #60a5fa;
    }
    .arrow-left.active { transform: translateY(-50%) scale(1.3); }

    .arrow-right {
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      border-left: 14px solid #60a5fa;
    }
    .arrow-right.active { transform: translateY(-50%) scale(1.3); }

    /* 坐标显示 */
    .joystick-values {
      display: flex;
      gap: 30px;
      justify-content: center;
    }

    .value-item { text-align: center; }

    .value-label {
      font-size: 12px;
      color: #64748b;
      margin-bottom: 4px;
    }

    .value-number {
      font-size: 24px;
      font-weight: 700;
      font-family: 'Courier New', monospace;
      color: #60a5fa;
    }

    /* 精确模式 */
    .precision-section { display: none; }
    .precision-section.active { display: block; }

    .precision-card {
      background: rgba(15, 23, 42, 0.4);
      border-radius: 12px;
      padding: 16px;
    }

    .precision-row {
      margin-bottom: 16px;
    }

    .precision-row:last-child { margin-bottom: 0; }

    .precision-row label {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      font-weight: 600;
      color: #94a3b8;
      margin-bottom: 8px;
    }

    .precision-row label strong {
      color: #60a5fa;
      font-family: 'Courier New', monospace;
    }

    input[type="range"] {
      width: 100%;
      height: 6px;
      -webkit-appearance: none;
      appearance: none;
      background: rgba(100, 116, 139, 0.3);
      border-radius: 3px;
      padding: 0;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(59, 130, 246, 0.5);
    }

    /* 预设动作 */
    .preset-section { margin-top: 16px; }

    .preset-title {
      font-size: 14px;
      font-weight: 600;
      color: #94a3b8;
      margin-bottom: 10px;
    }

    .preset-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .preset-btn {
      padding: 12px;
      border-radius: 10px;
      border: 1px solid rgba(148, 163, 184, 0.15);
      background: rgba(15, 23, 42, 0.4);
      color: #e2e8f0;
      font-size: 13px;
      cursor: pointer;
      text-align: left;
    }

    .preset-btn:hover {
      background: rgba(59, 130, 246, 0.15);
      border-color: rgba(59, 130, 246, 0.3);
    }

    .preset-btn .name {
      font-weight: 700;
      margin-bottom: 2px;
    }

    .preset-btn .desc {
      font-size: 11px;
      color: #64748b;
    }

    /* 状态栏 */
    .status-bar {
      margin-top: 16px;
      padding: 10px 16px;
      background: rgba(15, 23, 42, 0.6);
      border-radius: 10px;
      border: 1px solid rgba(148, 163, 184, 0.1);
      text-align: center;
      font-size: 13px;
      color: #94a3b8;
    }

    .status-bar.error {
      border-color: rgba(239, 68, 68, 0.3);
      background: rgba(239, 68, 68, 0.1);
      color: #fca5a5;
    }

    .status-bar.success {
      border-color: rgba(34, 197, 94, 0.3);
      background: rgba(34, 197, 94, 0.1);
      color: #86efac;
    }

    .loading {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: #60a5fa;
      animation: spin 0.8s linear infinite;
      margin-right: 6px;
      vertical-align: middle;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎯 云台摇杆控制</h1>

    <!-- 登录 -->
    <div class="section">
      <div class="section-title">🔑 登录获取设备</div>
      <div class="input-row" style="display:flex;gap:8px;margin-bottom:8px">
        <input type="text" id="username" placeholder="用户名" value="admin" style="flex:1">
        <input type="password" id="password" placeholder="密码" style="flex:1">
      </div>
      <div class="btn-row">
        <button class="btn-primary" onclick="login()">登录</button>
        <button class="btn-secondary" onclick="loadDevices()">刷新设备</button>
      </div>
    </div>

    <!-- 设备选择 -->
    <div class="section">
      <div class="section-title">📱 选择设备</div>
      <div class="device-list" id="deviceList">
        <div class="empty-state">请先登录</div>
      </div>
    </div>

    <!-- 控制区 -->
    <div class="control-section" id="controlSection">
      <div class="selected-device-bar">
        <div>
          <div class="name" id="selectedName">-</div>
          <div class="ip" id="selectedIp">-</div>
        </div>
        <button class="btn-secondary" onclick="deselectDevice()">切换</button>
      </div>

      <!-- 速度 -->
      <div class="speed-section">
        <button class="speed-btn" onclick="changeSpeed('slow')">慢</button>
        <button class="speed-btn active" onclick="changeSpeed('normal')">中</button>
        <button class="speed-btn" onclick="changeSpeed('fast')">快</button>
      </div>

      <!-- 模式切换 -->
      <div class="mode-toggle">
        <button class="mode-btn" id="modeBtn" onclick="toggleMode()">🎯 精确模式</button>
      </div>

      <!-- 摇杆 -->
      <div class="joystick-section" id="joystickSection">
        <div class="joystick-wrapper">
          <div class="joystick-base">
            <div class="arrow arrow-up" id="arrowUp"></div>
            <div class="arrow arrow-down" id="arrowDown"></div>
            <div class="arrow arrow-left" id="arrowLeft"></div>
            <div class="arrow arrow-right" id="arrowRight"></div>
            <div class="joystick-track"></div>
          </div>
          <div class="joystick-knob" id="joystickKnob"></div>
        </div>
        <div class="joystick-values">
          <div class="value-item">
            <div class="value-label">X 轴</div>
            <div class="value-number" id="valueX">0.00</div>
          </div>
          <div class="value-item">
            <div class="value-label">Y 轴</div>
            <div class="value-number" id="valueY">0.00</div>
          </div>
        </div>
      </div>

      <!-- 精确模式 -->
      <div class="precision-section" id="precisionSection">
        <div class="precision-card">
          <div class="precision-row">
            <label>Pan 水平 <strong id="panVal">0°</strong></label>
            <input type="range" id="panSlider" min="-45" max="45" value="0" oninput="onPrecision('pan',this.value)">
          </div>
          <div class="precision-row">
            <label>Tilt 俯仰 <strong id="tiltVal">0°</strong></label>
            <input type="range" id="tiltSlider" min="-90" max="90" value="0" oninput="onPrecision('tilt',this.value)">
          </div>
          <div class="precision-row">
            <label>Slider 滑轨 <strong id="sliderVal">0 mm</strong></label>
            <input type="range" id="sliderSlider" min="0" max="1200" value="0" step="10" oninput="onPrecision('slider',this.value)">
          </div>
        </div>
      </div>

      <!-- 预设 -->
      <div class="preset-section">
        <div class="preset-title">预设动作</div>
        <div class="preset-grid" id="presetGrid"></div>
      </div>
    </div>

    <div class="status-bar" id="statusBar">就绪</div>
  </div>

  <script>
    const API_BASE = 'https://api.genius.show'
    let token = ''
    let devices = []
    let selectedDevice = null
    let speed = 'normal'
    let isPrecisionMode = false
    let joystickActive = false
    let joystickX = 0
    let joystickY = 0
    let joystickTimer = null
    let precisionDebounce = null

    const JOYSTICK_RADIUS = 70
    const RENEW_INTERVAL = 150

    // 初始化
    document.addEventListener('DOMContentLoaded', () => {
      const saved = localStorage.getItem('joystick_token')
      if (saved) {
        token = saved
        loadDevices()
      }
      initJoystick()
    })

    // API 请求（后端）
    async function api(method, path, body = null) {
      const headers = { 'Content-Type': 'application/json' }
      if (token) headers['Authorization'] = `Bearer ${token}`
      const opts = { method, headers }
      if (body) opts.body = JSON.stringify(body)
      const res = await fetch(`${API_BASE}${path}`, opts)
      if (!res.ok) throw new Error(`${res.status}`)
      return res.json()
    }

    // 设备 HTTP请求（直接到 ESP8266）
    async function deviceHttp(method, path, body = null) {
      if (!selectedDevice) throw new Error('未选择设备')
      const ip = selectedDevice.ip
      const headers = { 'Content-Type': 'application/json' }
      const opts = { method, headers }
      if (body) opts.body = JSON.stringify(body)
      const res = await fetch(`http://${ip}${path}`, opts)
      if (!res.ok) throw new Error(`${res.status}`)
      return res.json()
    }

    // 登录
    async function login() {
      const username = document.getElementById('username').value.trim()
      const password = document.getElementById('password').value.trim()
      if (!username || !password) return showStatus('请输入用户名密码', 'error')

      showStatus('<span class="loading"></span>登录中...')
      try {
        const res = await api('POST', '/api/auth/login', { username, password })
        token = res.data.token
        localStorage.setItem('joystick_token', token)
        showStatus('登录成功 ✓', 'success')
        await loadDevices()
      } catch (e) {
        showStatus(`登录失败: ${e.message}`, 'error')
      }
    }

    // 加载设备
    async function loadDevices() {
      if (!token) return showStatus('请先登录', 'error')
      showStatus('<span class="loading"></span>加载设备...')
      try {
        const res = await api('GET', '/admin/device/my-list')
        devices = (res.data || []).filter(d => ['lamp', 'cam', 'camlamp'].includes(d.deviceType))
        renderDevices()
        showStatus(`已加载 ${devices.length} 个设备`, 'success')
      } catch (e) {
        showStatus(`加载失败: ${e.message}`, 'error')
      }
    }

    // 渲染设备列表
    function renderDevices() {
      const list = document.getElementById('deviceList')
      if (!devices.length) {
        list.innerHTML = '<div class="empty-state">无可用设备</div>'
        return
      }
      list.innerHTML = devices.map(d => `
        <div class="device-item ${selectedDevice?.chipId === d.chipId ? 'selected' : ''}"
             onclick="selectDevice('${d.chipId}')">
          <div class="status-dot ${d.online ? 'online' : 'offline'}"></div>
          <div class="device-info">
            <div class="device-name">${d.displayName || d.chipId}</div>
            <div class="device-meta">${d.ip} · ${d.chipId}</div>
          </div>
          <div class="device-type">${d.deviceType}</div>
        </div>
      `).join('')
    }

    // 选择设备
    function selectDevice(chipId) {
      selectedDevice = devices.find(d => d.chipId === chipId)
      if (!selectedDevice) return

      document.getElementById('selectedName').textContent = selectedDevice.displayName || chipId
      document.getElementById('selectedIp').textContent = selectedDevice.ip
      document.getElementById('controlSection').classList.add('active')
      renderDevices()
      updatePresets()
      setStatus(`已选择: ${chipId} (${selectedDevice.ip})`)
    }

    function deselectDevice() {
      selectedDevice = null
      document.getElementById('controlSection').classList.remove('active')
      renderDevices()
    }

    // 预设动作
    function updatePresets() {
      if (!selectedDevice) return
      const grid = document.getElementById('presetGrid')
      const common = [
        { action: 'home', name: '🏠 归位', desc: '回到默认位置' },
        { action: 'stop', name: '⏹️ 停止', desc: '停止当前位置' },
      ]
      let presets = []
      if (selectedDevice.deviceType === 'lamp') {
        presets = [
          { action: 'aim_person', name: '👤 照人', desc: '转到照人角度' },
          { action: 'aim_cloth', name: '👔 照服装', desc: '转到照服装角度' },
          ...common
        ]
      } else {
        presets = [
          { action: 'cam_person', name: '👤 对人', desc: '转到对人角度' },
          { action: 'cam_cloth', name: '👔 对服装', desc: '转到对服装角度' },
          ...common
        ]
      }
      grid.innerHTML = presets.map(p => `
        <button class="preset-btn" onclick="sendPreset('${p.action}')">
          <div class="name">${p.name}</div>
          <div class="desc">${p.desc}</div>
        </button>
      `).join('')
    }

    async function sendPreset(action) {
      try {
        await deviceHttp('POST', '/arm', { action })
        setStatus(`已发送: ${action}`, 'success')
      } catch (e) {
        setStatus(`发送失败: ${e.message}`, 'error')
      }
    }

    // 速度切换
    function changeSpeed(s) {
      speed = s
      document.querySelectorAll('.speed-btn').forEach(b => {
        b.classList.toggle('active', b.textContent === { slow: '慢', normal: '中', fast: '快' }[s])
      })
      deviceHttp('POST', '/arm/speed', { speed }).catch(() => {})
    }

    // 模式切换
    function toggleMode() {
      isPrecisionMode = !isPrecisionMode
      const btn = document.getElementById('modeBtn')
      if (isPrecisionMode) {
        stopJoystick()
        btn.textContent = '🕹️ 摇杆模式'
        btn.classList.add('active')
        document.getElementById('joystickSection').style.display = 'none'
        document.getElementById('precisionSection').classList.add('active')
      } else {
        btn.textContent = '🎯 精确模式'
        btn.classList.remove('active')
        document.getElementById('joystickSection').style.display = 'flex'
        document.getElementById('precisionSection').classList.remove('active')
      }
    }

    // 摇杆初始化
    function initJoystick() {
      const knob = document.getElementById('joystickKnob')
      knob.addEventListener('pointerdown', startJoystick)
      document.addEventListener('pointermove', moveJoystick)
      document.addEventListener('pointerup', stopJoystick)
      document.addEventListener('pointercancel', stopJoystick)
    }

    function startJoystick(e) {
      if (!selectedDevice) return setStatus('请先选择设备', 'error')
      e.preventDefault()
      joystickActive = true
      e.target.setPointerCapture(e.pointerId)
      updateFromPointer(e)
      sendJoystick()

      clearInterval(joystickTimer)
      joystickTimer = setInterval(() => {
        if (joystickActive) sendJoystick()
      }, RENEW_INTERVAL)
    }

    function moveJoystick(e) {
      if (!joystickActive) return
      updateFromPointer(e)
    }

    function stopJoystick() {
      if (!joystickActive) return
      joystickActive = false
      clearInterval(joystickTimer)
      joystickTimer = null
      joystickX = 0
      joystickY = 0
      updateKnob(0, 0)
      deviceHttp('POST', '/arm/stop').catch(() => {})
      setStatus('摇杆已释放')
    }

    function updateFromPointer(e) {
      const knob = document.getElementById('joystickKnob')
      const rect = knob.parentElement.getBoundingClientRect()
      const cx = rect.left + rect.width / 2
      const cy = rect.top + rect.height / 2

      let dx = e.clientX - cx
      let dy = e.clientY - cy
      const dist = Math.sqrt(dx * dx + dy * dy)
      if (dist > JOYSTICK_RADIUS) {
        dx *= JOYSTICK_RADIUS / dist
        dy *= JOYSTICK_RADIUS / dist
      }

      joystickX = +(dx / JOYSTICK_RADIUS).toFixed(2)
      joystickY = +(-dy / JOYSTICK_RADIUS).toFixed(2)

      updateKnob(dx, dy)
      updateArrows()
      updateValues()
    }

    function updateKnob(dx, dy) {
      document.getElementById('joystickKnob').style.transform =
        `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`
    }

    function updateArrows() {
      document.getElementById('arrowUp').classList.toggle('active', joystickY > 0.3)
      document.getElementById('arrowDown').classList.toggle('active', joystickY < -0.3)
      document.getElementById('arrowLeft').classList.toggle('active', joystickX < -0.3)
      document.getElementById('arrowRight').classList.toggle('active', joystickX > 0.3)
    }

    function updateValues() {
      document.getElementById('valueX').textContent = joystickX.toFixed(2)
      document.getElementById('valueY').textContent = joystickY.toFixed(2)
    }

    function sendJoystick() {
      if (!selectedDevice) return
      deviceHttp('POST', '/arm/joystick', { x: joystickX, y: joystickY }).catch(() => {})
    }

    // 精确模式
    function onPrecision(field, val) {
      const v = Number(val)
      document.getElementById(`${field}Val`).textContent = field === 'slider' ? `${v} mm` : `${v}°`

      clearTimeout(precisionDebounce)
      precisionDebounce = setTimeout(() => {
        const payload = {}
        payload[field] = v
        deviceHttp('POST', '/arm/position', payload)
          .then(() => setStatus(`${field}=${v}`, 'success'))
          .catch(e => setStatus(`失败: ${e.message}`, 'error'))
      }, 300)
    }

    // 状态
    function showStatus(html, type) {
      const bar = document.getElementById('statusBar')
      bar.innerHTML = html
      bar.className = 'status-bar' + (type ? ` ${type}` : '')
    }

    function setStatus(text, type) {
      showStatus(text, type)
    }
  </script>
</body>
</html>
